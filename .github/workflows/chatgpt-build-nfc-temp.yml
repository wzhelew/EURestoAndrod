name: ChatGPT temporary NFC build

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/chatgpt-build-nfc-temp.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-nfc-uchebnici-20260826
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: nfc-app
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NfcUchebnici-apk
          path: nfc-app/app/build/outputs/apk/debug/app-debug.apk
