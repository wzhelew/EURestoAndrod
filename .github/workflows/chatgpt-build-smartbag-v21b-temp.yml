name: ChatGPT temporary SmartBag v2.1b build

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/chatgpt-build-smartbag-v21b-temp.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-nfc-uchebnici-20260826
          fetch-depth: 0
      - name: Restore last working SmartBag v2
        run: |
          git show e98c5c8ffa28780f35df01e2c964b5f6101e413d:smartbag-v2-overlay.b64 | base64 -d > /tmp/smartbag-v2.zip
          unzip -o /tmp/smartbag-v2.zip -d nfc-app
      - name: Improve bottom navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nfc-app/app/src/main/java/bg/delfi/nfcuchebnici/MainActivity.java')
          s=p.read_text()
          s=s.replace('    private String waitingItemId = null;\n', '    private String waitingItemId = null;\n    private LinearLayout navToday, navSubjects, navSchedule;\n')
          old='''        LinearLayout bottom = new LinearLayout(this);\n        bottom.setOrientation(LinearLayout.HORIZONTAL);\n        bottom.setPadding(dp(6), dp(6), dp(6), dp(6));\n        bottom.setBackgroundColor(0xFFFFFFFF);\n\n        Button today = navButton("✓ Днес");\n        today.setOnClickListener(v -> showToday());\n        bottom.addView(today, new LinearLayout.LayoutParams(0, dp(54), 1f));\n\n        Button subs = navButton("📚 Предмети");\n        subs.setOnClickListener(v -> showSubjects());\n        bottom.addView(subs, new LinearLayout.LayoutParams(0, dp(54), 1f));\n\n        Button plan = navButton("📅 Програма");\n        plan.setOnClickListener(v -> showSchedule());\n        bottom.addView(plan, new LinearLayout.LayoutParams(0, dp(54), 1f));\n\n        root.addView(bottom, new LinearLayout.LayoutParams(-1, -2));\n        setContentView(root);\n    }\n\n    private Button navButton(String text) {\n        Button b = new Button(this);\n        b.setText(text);\n        b.setTextSize(13);\n        b.setAllCaps(false);\n        return b;\n    }\n'''
          new='''        LinearLayout bottom = new LinearLayout(this);\n        bottom.setOrientation(LinearLayout.HORIZONTAL);\n        bottom.setGravity(Gravity.CENTER);\n        bottom.setPadding(dp(8), dp(6), dp(8), dp(8));\n        bottom.setBackgroundColor(0xFFFFFFFF);\n\n        navToday = navItem("✓", "Днес");\n        navToday.setOnClickListener(v -> showToday());\n        bottom.addView(navToday, navParams(true));\n\n        navSubjects = navItem("📚", "Предмети");\n        navSubjects.setOnClickListener(v -> showSubjects());\n        bottom.addView(navSubjects, navParams(false));\n\n        navSchedule = navItem("📅", "Програма");\n        navSchedule.setOnClickListener(v -> showSchedule());\n        bottom.addView(navSchedule, navParams(false));\n\n        root.addView(bottom, new LinearLayout.LayoutParams(-1, -2));\n        setContentView(root);\n        updateNavSelection();\n    }\n\n    private LinearLayout.LayoutParams navParams(boolean first) {\n        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(64), 1f);\n        if (!first) p.leftMargin = dp(6);\n        return p;\n    }\n\n    private LinearLayout navItem(String icon, String label) {\n        LinearLayout box = new LinearLayout(this);\n        box.setOrientation(LinearLayout.VERTICAL);\n        box.setGravity(Gravity.CENTER);\n        box.setPadding(dp(4), dp(5), dp(4), dp(4));\n        box.setClickable(true);\n        box.setFocusable(true);\n\n        TextView iv = new TextView(this);\n        iv.setText(icon);\n        iv.setTextSize(20);\n        iv.setGravity(Gravity.CENTER);\n        box.addView(iv, new LinearLayout.LayoutParams(-1, dp(27)));\n\n        TextView tv = new TextView(this);\n        tv.setText(label);\n        tv.setTextSize(12);\n        tv.setSingleLine(true);\n        tv.setGravity(Gravity.CENTER);\n        tv.setTypeface(Typeface.DEFAULT, Typeface.BOLD);\n        box.addView(tv, new LinearLayout.LayoutParams(-1, dp(24)));\n        return box;\n    }\n\n    private void updateNavSelection() {\n        styleNav(navToday, currentScreen == NAV_TODAY);\n        styleNav(navSubjects, currentScreen == NAV_SUBJECTS);\n        styleNav(navSchedule, currentScreen == NAV_SCHEDULE);\n    }\n\n    private void styleNav(LinearLayout box, boolean selected) {\n        if (box == null) return;\n        GradientDrawable bg = new GradientDrawable();\n        bg.setCornerRadius(dp(12));\n        bg.setColor(selected ? 0xFFE6F0FA : 0xFFF2F4F6);\n        bg.setStroke(dp(1), selected ? 0xFFB8CFE5 : 0xFFE2E6EA);\n        box.setBackground(bg);\n        int textColor = selected ? 0xFF133C67 : 0xFF303841;\n        for (int i = 0; i < box.getChildCount(); i++) {\n            View child = box.getChildAt(i);\n            if (child instanceof TextView) ((TextView) child).setTextColor(textColor);\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('navigation block not found')
          s=s.replace(old,new)
          s=s.replace('    private void showToday() {\n        currentScreen = NAV_TODAY;\n','    private void showToday() {\n        currentScreen = NAV_TODAY;\n        updateNavSelection();\n')
          s=s.replace('    private void showSubjects() {\n        currentScreen = NAV_SUBJECTS;\n','    private void showSubjects() {\n        currentScreen = NAV_SUBJECTS;\n        updateNavSelection();\n')
          s=s.replace('    private void showSchedule() {\n        currentScreen = NAV_SCHEDULE;\n','    private void showSchedule() {\n        currentScreen = NAV_SCHEDULE;\n        updateNavSelection();\n')
          p.write_text(s)
          gp=Path('nfc-app/app/build.gradle')
          g=gp.read_text().replace("applicationId 'bg.delfi.nfcuchebnici'", "applicationId 'bg.delfi.smartbag'").replace('versionCode 2','versionCode 3').replace("versionName '2.0'", "versionName '2.1'")
          gp.write_text(g)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: nfc-app
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UmnaRanica-v2.1-apk
          path: nfc-app/app/build/outputs/apk/debug/app-debug.apk
