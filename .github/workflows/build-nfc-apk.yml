name: Build NFC APK

on:
  push:
    branches:
      - chatgpt-nfc-uchebnici-20260826
    paths:
      - 'nfc-app/**'
      - '.github/workflows/build-nfc-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: nfc-app
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NfcUchebnici-apk
          path: nfc-app/app/build/outputs/apk/debug/app-debug.apk
